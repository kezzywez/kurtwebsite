  <main class="wrap" style="padding-top: 56px;">

        <button class="admin-signin" id="signInBtn" type="button">

      <div id="signedIn" hidden>

  <footer class="site-footer">

      <span>&copy; <span id="year"></span> Kurt Zepeda</span>

          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.86 0-2.15 1.45-2.15 2.94v5.66H9.35V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56z"/></svg>

          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.16 19.5c.5.1.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.46-1.15-1.11-1.46-1.11-1.46-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.3 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .26.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>

  <script src="/js/main.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import {
      getFirestore, collection, query, orderBy, onSnapshot, deleteDoc, doc
    } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBGT0qYIX7iaGN42I0gLz28KoFcQzNSGkY",
      authDomain: "kurt-zepeda.firebaseapp.com",
      projectId: "kurt-zepeda",
      storageBucket: "kurt-zepeda.firebasestorage.app",
      messagingSenderId: "511031545234",
      appId: "1:511031545234:web:e99351e4352bf77d02854b"
    };

    const ADMIN_EMAIL = "kurt.m.zepeda@gmail.com";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const guestbookRef = collection(db, "guestbook");

    const signedOutEl = document.getElementById("signedOut");
    const signedInEl = document.getElementById("signedIn");
    const signInBtn = document.getElementById("signInBtn");
    const signInStatus = document.getElementById("signInStatus");
    const signOutBtn = document.getElementById("signOutBtn");
    const userPhoto = document.getElementById("userPhoto");
    const userEmail = document.getElementById("userEmail");
    const listEl = document.getElementById("guestbookList");

    let unsubscribe = null;

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function formatDate(ts) {
      if (!ts || !ts.toDate) return "";
      return ts.toDate().toLocaleString(undefined, {
        year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
      });
    }

    function renderEntries() {
      const q = query(guestbookRef, orderBy("createdAt", "desc"));
      unsubscribe = onSnapshot(
        q,
        (snapshot) => {
          if (snapshot.empty) {
            listEl.innerHTML = '<li class="guestbook-empty">No entries yet.</li>';
            return;
          }
          listEl.innerHTML = "";
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const li = document.createElement("li");
            li.className = "guestbook-entry";
            li.innerHTML =
              '<div class="entry-body">' +
                '<span class="entry-name">' + escapeHtml(data.name || "Anonymous") + '</span>' +
                '<span class="entry-date">' + formatDate(data.createdAt) + '</span>' +
                '<p class="entry-message">' + escapeHtml(data.message || "") + '</p>' +
              '</div>' +
              '<button class="entry-delete" type="button">Delete</button>';
            li.querySelector(".entry-delete").addEventListener("click", async () => {
              if (!confirm("Delete this entry?")) return;
              await deleteDoc(doc(db, "guestbook", docSnap.id));
            });
            listEl.appendChild(li);
          });
        },
        (err) => {
          listEl.innerHTML = '<li class="guestbook-empty">Couldn\'t load entries: ' + escapeHtml(err.message) + '</li>';
        }
      );
    }

    signInBtn.addEventListener("click", () => {
      signInStatus.textContent = "";
      signInStatus.classList.remove("is-error");
      signInWithPopup(auth, new GoogleAuthProvider()).catch((err) => {
        if (err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request") return;
        signInStatus.textContent = "Sign-in failed — try again.";
        signInStatus.classList.add("is-error");
      });
    });

    signOutBtn.addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (unsubscribe) {
        unsubscribe();
        unsubscribe = null;
      }

      if (user && user.email === ADMIN_EMAIL) {
        signedOutEl.hidden = true;
        signedInEl.hidden = false;
        userPhoto.src = user.photoURL || "";
        userEmail.textContent = user.email;
        renderEntries();
      } else if (user) {
        signOut(auth);
        signInStatus.textContent = "That Google account isn't authorized for this page.";
        signInStatus.classList.add("is-error");
        signedOutEl.hidden = false;
        signedInEl.hidden = true;
      } else {
        signedOutEl.hidden = false;
        signedInEl.hidden = true;
      }
    });
  </script>
</body>
</html>
